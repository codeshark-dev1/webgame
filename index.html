<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game_area">
        <h1 id="score_counter">Score: 0</h1>
        <!-- <h2 id="highscore_counter">Highscore: 0</h2> -->
        <svg width="100px" height="100px" id="player" class="game_object">
            <circle cx="50" cy="50" r="30" fill="#1863db" />
        </svg>
        <svg width="100px" height="100px" id="enemy" class="game_object">
            <circle cx="50" cy="50" r="30" fill="#db1822" />
        </svg>

        <svg width="100" height="100" id="coin" class="game_object">
            <circle cx="50" cy="50" r="15" fill="yellow"/>
        </svg>
    </div>
</body>
</html>
<script src="helpers.js"></script>
<script src="gameLogic.js"></script>
