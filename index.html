<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Game</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>
    <div class="menu_container">
        <div class="menu">
            <h1>Chase the chase</h1>
            <p>Use [ARROWS] to move</p>
            <p>Collect coins and avoid the enemy!</p>
            <a href="game.html"><button class="btn">Play Game</button></a>
            <p id="highscore">Highscore: 0</p>
            <br>
            <br>
            <p>Made by Shark Games</p>
            <p>Lukas van Buren</p>
        </div>
    </div>
</body>
</html>
<script>
    const highscore_display = document.getElementById("highscore");

    const highscore = Number(localStorage.getItem("highscore"));
    highscore_display.innerHTML = `Highscore: ${highscore}`;
</script>
